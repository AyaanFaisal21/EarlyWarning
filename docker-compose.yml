services:
  neo4j:
    image: neo4j:5.26
    container_name: earlywarning-neo4j
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    environment:
      NEO4J_AUTH: neo4j/hackathon2026
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_max__size: 2G
    volumes:
      - neo4j-data:/data

volumes:
  neo4j-data:
